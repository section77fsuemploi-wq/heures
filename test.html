<!-- Fichier produit par outils/construire-entree.js à partir de src/html/page.html. Ne pas modifier à la main. -->
<!-- Polices de la charte. Si le chargement échoue, Georgia et Segoe UI prennent le relais : la page reste lisible.
     Les deux preconnect ouvrent tôt la connexion à la feuille de style et aux fichiers de police. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Public+Sans:wght@400;600;700&amp;display=swap">
<style>
  /* Charte FSU Emploi. L'orange est réservé au bouton qui envoie ou confirme et aux encadrés « à faire »,
     toujours avec un texte à l'encre. Le vert vif et le jaune ne portent jamais de texte. */
  :root {
    --bleu: #253182; --bleu-fonce: #1A2466; --bleu-pale: #EEF0F9;
    --orange: #F39200; --orange-fonce: #E08700; --orange-pale: #FFF4E0;
    --rouge-vif: #E41B13; --rouge: #B3140F; --rouge-pale: #FDECEA;
    --vert-vif: #4DA22E; --vert: #1E7A45; --vert-pale: #E5F3EA;
    --jaune: #FFDD00;
    --encre: #161922; --gris: #5A6074; --bord: #C9CFE8; --bord-champ: #7C839C;
    --fond: #FBFBFD; --blanc: #FFFFFF; --bandeau-second: #DCE0F5;
    --titre: "Playfair Display", Georgia, serif;
    --texte: "Public Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--fond); color: var(--encre); font: 1rem/1.5 var(--texte); overflow-wrap: break-word; }

  /* Bandeau : logo, nom de la section, puis le filet aux quatre couleurs. */
  .bandeau { background: var(--bleu); color: var(--blanc); }
  .bandeau-int { max-width: 42rem; margin: 0 auto; padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.8rem; }
  .bandeau img { height: 48px; width: auto; flex: none; display: block; }
  .marque { margin: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .marque strong { font-weight: 700; font-size: 1.05rem; }
  .marque span { font-size: 0.9rem; color: var(--bandeau-second); }
  .filet { display: flex; height: 5px; border-top: 1px solid var(--blanc); }
  .filet span { flex: 1; }
  .f-bleu { background: var(--bleu); } .f-rouge { background: var(--rouge-vif); } .f-jaune { background: var(--jaune); } .f-vert { background: var(--vert-vif); }

  main { max-width: 42rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
  h1 { font: 700 1.6rem/1.2 var(--titre); color: var(--bleu); margin: 0.75rem 0 1rem; }
  h2 { font-size: 1.15rem; line-height: 1.3; color: var(--bleu); margin: 2rem 0 0.5rem; border-bottom: 1px solid var(--bord); padding-bottom: 0.25rem; }
  h3 { font-size: 1rem; line-height: 1.3; color: var(--bleu); margin: 1.2rem 0 0.3rem; }
  p { margin: 0.5rem 0; }
  a { color: var(--bleu); }
  a.lien { display: inline-block; padding: 0.6rem 0; font-weight: 600; }
  ul { padding-left: 1.2rem; margin: 0.3rem 0; }

  /* Le focus se voit toujours. Le titre reçoit le focus à chaque changement d'écran : son contour ne s'affiche qu'au clavier. */
  :focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }
  h1:focus { outline: none; }
  h1:focus-visible { outline: 3px solid var(--bleu); outline-offset: 4px; border-radius: 4px; }

  label { display: block; margin: 0.9rem 0 0.2rem; font-weight: 600; }
  .aide { color: var(--gris); font-size: 0.9rem; margin: 0.1rem 0 0.3rem; }
  .aide p { margin: 0.1rem 0; }
  input[type=text], input[type=date], input[type=email], select, textarea {
    width: 100%; min-height: 44px; padding: 0.55rem 0.6rem; font: inherit; color: inherit; background: var(--blanc); border: 1px solid var(--bord-champ); border-radius: 8px; }
  textarea { min-height: 5rem; }
  .case { display: flex; gap: 0.7rem; align-items: center; min-height: 44px; margin: 1rem 0; }
  .case input { width: 1.5rem; height: 1.5rem; flex: none; accent-color: var(--bleu); }
  .case label { margin: 0; font-weight: 400; }

  /* Trois niveaux de boutons : principal (bleu), envoi (orange, texte à l'encre), secondaire (contour bleu). */
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0.55rem 1rem; margin: 0.5rem 0.5rem 0 0; border: 2px solid var(--bleu); border-radius: 8px; background: var(--bleu); color: var(--blanc); cursor: pointer; }
  button:hover { background: var(--bleu-fonce); border-color: var(--bleu-fonce); }
  button.envoi { background: var(--orange); border-color: var(--orange); color: var(--encre); }
  button.envoi:hover { background: var(--orange-fonce); border-color: var(--orange-fonce); }
  button.second { background: var(--blanc); color: var(--bleu); }
  button.second:hover { background: var(--bleu-pale); border-color: var(--bleu); }
  /* Bouton à deux temps, armé : il attend le second appui. */
  button.arme, button.arme:hover { background: var(--rouge-pale); border-color: var(--rouge); color: var(--rouge); }
  button:disabled { opacity: 0.6; cursor: default; }

  /* Encadrés : « à faire » en orange, information en bleu, réussite en vert, erreur en rouge. */
  .encadre, .message { border-left: 4px solid var(--orange); background: var(--orange-pale); border-radius: 0 8px 8px 0; padding: 0.7rem 0.9rem; margin: 0.8rem 0; }
  .encadre.info, .message { border-left-color: var(--bleu); background: var(--bleu-pale); }
  .encadre.reussite, .message.reussite { border-left-color: var(--vert-vif); background: var(--vert-pale); color: var(--vert); font-weight: 600; }
  .message.erreur { border-left-color: var(--rouge-vif); background: var(--rouge-pale); color: var(--rouge); }
  .encadre.test { border: 2px solid var(--orange); border-left-width: 8px; font-weight: 700; }
  .encadre > p:first-child, .message > p:first-child { margin-top: 0; }
  .encadre > p:last-child, .message > p:last-child { margin-bottom: 0; }

  .carte { background: var(--blanc); border: 1px solid var(--bord); border-radius: 8px; padding: 0.8rem 0.9rem; margin: 0.8rem 0; }
  .carte .num { font-weight: 700; margin-top: 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bleu-pale); padding: 0.7rem; font-size: 0.85rem; border-radius: 8px; }
  footer { margin-top: 3rem; color: var(--gris); font-size: 0.85rem; border-top: 1px solid var(--bord); padding-top: 0.6rem; }
  details { margin: 0.8rem 0; }
  summary { cursor: pointer; min-height: 44px; padding: 0.6rem 0; color: var(--bleu); font-weight: 600; }
  .empreinte { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; overflow-wrap: anywhere; }
  .suite { margin-top: 2.5rem; border-top: 1px solid var(--bord); }

  /* Tableaux : ils défilent dans leur cadre, la première colonne reste en place. Un mot n'est jamais coupé :
     un nom long passe à la ligne entre deux mots. */
  .defile { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0.6rem 0; background: var(--blanc); border: 1px solid var(--bord); border-radius: 8px; }
  table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 0.9rem; }
  th, td { border-bottom: 1px solid var(--bord); border-right: 1px solid var(--bord); padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; background: var(--blanc); overflow-wrap: normal; }
  thead th { background: var(--bleu-pale); color: var(--bleu); font-weight: 600; vertical-align: bottom; }
  tbody th { font-weight: 600; }
  tbody tr:last-child > * { border-bottom: 0; }
  tr > :last-child { border-right: 0; }
  td.nom, th.nom, td.fixe { white-space: nowrap; }
  td.nombre { text-align: right; white-space: nowrap; }
  .colle { position: sticky; left: 0; z-index: 1; white-space: normal; border-right: 2px solid var(--bord); }
  thead .colle { z-index: 2; }
  /* Un nom tient sur une ligne. Sur téléphone seulement, il passe à la ligne entre deux mots, jamais au milieu d'un mot. */
  tbody .colle.nom { white-space: nowrap; }
  @media (max-width: 600px) { tbody .colle.nom { width: 9rem; white-space: normal; } }
  .mot { white-space: nowrap; }
  td.empreinte { min-width: 15rem; }

  .ligne { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: 0.4rem; }
  .ligne select, .ligne input { width: auto; flex: 1 1 12rem; min-width: 0; max-width: 100%; }
  .ligne button { margin-top: 0; }
  .rang { justify-content: space-between; gap: 0.3rem 0.8rem; border-bottom: 1px solid var(--bord); padding: 0.5rem 0; margin-top: 0; }
  .rang .nomrang { font-weight: 600; flex: 1 1 10rem; }
  .rang button { margin: 0; }

  /* Lu par les lecteurs d'écran, absent de l'écran. */
  .hors-ecran { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  /* Téléphone : un bouton par ligne, sur toute la largeur. Deux gestes ne se touchent plus. */
  @media (max-width: 30rem) {
    button { display: block; width: 100%; margin: 0.6rem 0 0; }
    .rang button, .ligne button { width: auto; }
    .ligne button { flex: 1 1 100%; }
    h1 { font-size: 1.45rem; }
  }
</style>
</head>

<script>
// Amorçage de la page d'entrée, écrit par outils/construire-entree.js à la place des scriptlets de Google.
// Tout ce que la page doit savoir se lit après le « # » : cette partie de l'adresse ne part jamais vers l'hébergeur.
(function () {
  'use strict';
  var EXEC = "https://script.google.com/macros/s/AKfycbwGIGtDPT4hZvmjWE4v0VTvr8CGE3DHLxsvrPaEQBEK-otXtV1BeVVDIhSSlu2EEZGK/exec", VERSION = "0.10.0", TEST = true;
  var app = document.getElementById('app');
  function lire(texte) {
    var lu = Object.create(null);
    String(texte || '').split('&').forEach(function (bout) {
      var i = bout.indexOf('=');
      if (i < 1) return;
      try { lu[bout.slice(0, i)] = decodeURIComponent(bout.slice(i + 1)); } catch (e) { /* morceau illisible : ignoré */ }
    });
    return lu;
  }
  // L'adresse de base : tout ce qui précède le premier « ? » ou « # ».
  var href = String(location.href || '');
  var coupe = href.search(/[?#]/);
  var base = coupe < 0 ? href : href.slice(0, coupe);
  var iq = href.indexOf('?'), id = href.indexOf('#');
  var recherche = iq >= 0 && (id < 0 || iq < id) ? href.slice(iq + 1, id < 0 ? href.length : id) : '';
  var lu = lire(String(location.hash || '').replace(/^#/, ''));
  if (recherche) {
    // Un jeton posé après un « ? » : repris, placé après le « # », et le « ? » quitte la barre d'adresse.
    var q = lire(recherche);
    var repris = false;
    if (!lu.a && !lu.j) {
      ['a', 'j', 'p', 'k'].forEach(function (cle) {
        if (q[cle] && !lu[cle]) { lu[cle] = q[cle]; repris = true; }
      });
    }
    var diese = repris ? ['a', 'j', 'p', 'k'].filter(function (cle) { return lu[cle]; }).map(function (cle) {
      return cle + '=' + encodeURIComponent(lu[cle]);
    }).join('&') : String(location.hash || '').replace(/^#/, '');
    try { window.history.replaceState(null, '', base + (diese ? '#' + diese : '')); } catch (e) { /* adresse laissée telle quelle */ }
  }
  // La même décision que doGet. Sans rien de reconnu : l'écran « Ouvre ton espace ».
  app.dataset.vue = lu.a ? 'action' : lu.j ? 'espace' : lu.p === 'perdu' ? 'perdu' : TEST && lu.p === 'boite' ? 'boite' : 'entree';
  app.dataset.jeton = String(lu.a || lu.j || '');
  app.dataset.cle = TEST ? String(lu.k || '') : '';
  app.dataset.url = EXEC;
  app.dataset.version = VERSION;
  app.dataset.entree = base;
  // Un lien interne ne change que le « # » : la page se recharge pour ouvrir la bonne vue.
  window.addEventListener('hashchange', function () { location.reload(); });
})();

(function () {
  'use strict';
  var app = document.getElementById('app');
  var vivant = document.getElementById('annonces');
  var VUE = app.dataset.vue, JETON = app.dataset.jeton, CLE = app.dataset.cle, URL_APP = app.dataset.url, VERSION = app.dataset.version;
  // Adresse de la page d'entrée hors Google, posée par son amorçage. Vide quand Google sert la page.
  var ENTREE = app.dataset.entree || '';
  var regle = '';
  var ATTENTE = 'ça prend jusqu\'à 15 secondes';
  /** Un bouton à deux temps armé revient seul à son état de départ après ce délai. */
  var DESARMEMENT = 8000;

  /** Espaces insécables : dans les guillemets, avant deux-points, point-virgule, point d'interrogation et pourcentage, entre un nombre et « h ». */
  function typo(t) {
    return String(t).replace(/« /g, '«\u00a0').replace(/ »/g, '\u00a0»').replace(/ ([:;?%])/g, '\u00a0$1').replace(/(\d) h(?![a-zà-ÿ])/g, '$1\u00a0h');
  }
  function minuscule(t) { return t.charAt(0).toLowerCase() + t.slice(1); }

  // Tout le contenu est posé par textContent : rien de ce qui vient du serveur n'est interprété comme du HTML.
  function el(balise, attributs, enfants) {
    var n = document.createElement(balise);
    Object.keys(attributs || {}).forEach(function (k) {
      var v = attributs[k];
      if (v === null || v === undefined) return;
      if (k === 'texte') n.textContent = typo(v);
      else if (k === 'clic') n.addEventListener('click', v);
      else if (k === 'classe') n.className = v;
      else n.setAttribute(k, v);
    });
    (enfants || []).forEach(function (e) { if (e) n.appendChild(typeof e === 'string' ? document.createTextNode(typo(e)) : e); });
    return n;
  }
  function vider(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  function cleUnique() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12); }
  function heures(n) { return String(n).replace('.', ',') + ' h'; }

  // ------------------------------------------------------------ lien d'action

    attente('Demande d\'heures');
    appel('api_ouvrirAction', [JETON], function (r) {
      if (!r.ok) return lienInvalide();
      regle = r.versionRegle;
      var d = r.demande;
      var recap = el('div', { classe: 'carte' }, [
        el('p', { classe: 'num', texte: 'Demande ' + d.id + (r.pour ? ', déposée par ' + r.pour : '') }),

      var suite = function () { return el('p', { texte: r.pour ? 'Tu peux fermer cette page.' : FIN_DE_PAGE }); };

      var fini = function (titre, texte, genre, blocs) {
        page(titre, [encart(texte, genre)].concat(blocs || [], [suite()]));
        annoncer(texte);
      };
      var dejaTraite = function (c) { fini('Déjà traité', 'Demande ' + d.id + '. État : ' + c.statutLibelle + '.'); };

      if (!r.encoreUtile) {
        // « Déjà servi » seulement si ce lien a produit son effet ; une demande éteinte entre-temps n'a rien reçu de lui.
        var constat = r.dejaServi ? 'Ce lien a déjà servi.' : 'Ce lien n\'est plus utile.';
        return page('Demande d\'heures', [recap, encart(constat + ' État de la demande : ' + r.statutLibelle + '.'), suite()]);
      }

        var confirmer = bouton('Confirmer ma demande', function (b) {
          appel('api_confirmer', [JETON], function (c) {
            if (!c.ok) return dire(retour, c);
            if (c.sansEffet) return dejaTraite(c);
            if (c.resultat === 'valide') {
              return fini('C\'est confirmé', 'Demande ' + d.id + ' confirmée. Le secrétaire va la saisir chez France Travail.', 'reussite',
                c.refusNonOppose ? [el('p', { classe: 'encadre info', texte: 'Période d\'essai : après la date d\'effet votée, cette demande aurait été refusée. ' + phraseRefus(c.refusNonOppose) })] : []);
            }
            var refus = 'La demande ' + d.id + ' est refusée. ' + phraseRefus(c.refus);

              el('p', { texte: 'Tu peux contester ce refus dans le mois : ouvre ton lien personnel, puis le bouton « Contester le refus » sous cette demande.' })]);
          }, b);
        }, 'envoi');

          el('p', { texte: r.essaiDemande ? 'Vérifie, puis confirme.' : 'Vérifie, puis confirme. Sans confirmation dans les ' + r.confirmationHeures + ' heures, la demande s\'éteint.' }),

          appel('api_declarerEtat', [JETON, valeur, mot.value, valeur === 'fait' && utilise ? dateFr(utilise.value) : ''], function (c) {

  // -------------------------------------------------------- gérer la section
  var G = { tableau: null, personnes: null };

  /** Recharge les deux jeux de données du secrétaire, en parallèle, sans toucher à l'écran. */

    var reste = 2, echec = null;
    var fin = function (cle) {
      return function (r) {
        if (r.ok) G[cle] = r; else echec = r;

        regle = G.tableau.versionRegle;

      };
    };

    appel('api_personnes', [JETON], fin('personnes'));
  }
  var ECRANS = {};
  function aller(cible, arg, message) { (ECRANS[cible] || ECRANS.gestion)(message || '', arg); }

  /** Après un geste réussi : recharger sans blanchir, puis afficher l'écran voulu avec son message. textes : les erreurs dites avec les mots de l'écran. */
  function suiteGeste(cible, arg, message, zone, textes) {
    return function (r) {
      if (!r.ok) return dire(zone, r, textes);
      chargerGestion(function () { aller(cible, arg, typeof message === 'function' ? message(r) : message); });
    };
  }
  /** Adresse déjà portée par une autre fiche : dire laquelle, et proposer d'y aller, ou la sortie donnée par l'écran. */
  function direAdressePrise(zone, chez, sortie) {
    vider(zone).appendChild(el('div', { classe: 'message erreur', role: 'alert' }, [
      el('p', { texte: 'Cette adresse est déjà sur une autre fiche : ' + chez.nom + ' ' + chez.prenom + ' (' + chez.id + ').' })

  }
  /** Trois étapes obligatoires : sa fiche, son lien, les heures de la section. Les personnes et les chantiers viennent ensuite, sans rouvrir la mise en route. */
  function routeFinie() { var m = G.tableau.miseEnRoute; return m.fiche && m.lien && m.heures; }

  }

  // --- mise en route

      ]);
    };
    var envoyerMonLien = bouton('M\'envoyer mon lien', function (b) {
      appel('api_gererLien', [JETON, moi().id, 'envoyer'], function (r) { if (r.ok) return vueFinLien(moi().mail); dire(retour, r); }, b);
    }, 'envoi');
    var pret = m.fiche && m.lien;
    var phraseLien = !m.fiche ? 'Fais d\'abord l\'étape 1.'
      : m.lien ? 'Ton lien est parti à ' + moi().mail + '. Pour en recevoir un autre, ouvre ta fiche.'

        pret ? 'Indique les heures que la section a reçues, compteur par compteur. Sans elles, aucune demande ne trouve d\'heures.' : 'Fais d\'abord les étapes 1 et 2.',
        pret ? bouton(m.heures ? 'Revoir les heures' : 'Indiquer les heures reçues', function () { aller('heures'); }, m.heures ? 'second' : '') : null),
      routeFinie() ? el('p', { classe: 'encadre reussite', texte: 'L\'outil est en route. Tu reçois un mail les jours où une demande attend ta saisie.' }) : null,
      routeFinie() ? el('h2', { texte: 'Et ensuite' }) : null,

  // --- sommaire
  ECRANS.gestion = function (message) {

      routeFinie() ? null : el('p', {}, [bouton('Reprendre la mise en route', function () { aller('route'); })]),
      entree('Le travail du jour (' + jour + ')', 'travail', jour > 0),
      entree('Personnes et liens (' + (m.sansLien ? m.sansLien + ' sans lien' : pluriel(m.personnes + 1, 'personne', 'personnes')) + ')', 'personnes'),
      entree('Heures de la section', 'heures'),

      entree('Réglages', 'reglages'),

    ]);

  // --- travail du jour
  ECRANS.travail = function (message) {
    var t = G.tableau;
    var retour = el('div');
    // La clé se tire au dessin du bouton, pas au clic : deux appuis portent la même. args : un tableau, ou une

    var fait = function (nom, args, texte, textes) {
      var cle = cleUnique();

        var valeurs = typeof args === 'function' ? args() : args;

      };
    };
    // Une demande éteinte à qui le bureau donne raison repart en confirmation : on le dit au secrétaire.
    var decider = function (c, decision) {
      return fait('api_decider', [c.demande, decision],
        function (r) { return r.aConfirmer ? 'Décision notée. La personne reçoit un nouveau lien pour confirmer sa demande.' : c.demande + ' : décision notée.'; },
        { rien_a_contester: 'Il n\'y a plus rien à trancher sur cette demande.' });
    };
    var liste = function (motifs) { return Object.keys(motifs).map(function (k) { return option(k, motifs[k]); }); };
    // Une carte, deux lignes : qui et quand, puis quoi.
    var depuis = function (l) {
      if (l.nature === 'cession') return l.jours ? 'confirmée il y a ' + pluriel(l.jours, 'jour', 'jours') : 'confirmée aujourd\'hui';

  ECRANS.fiche = function (message, id) {

    var retour = el('div');
    var champ = function (suffixe, libelle, type, valeur, texteAide) {
      var saisie = el('input', { type: type, id: 'f-' + suffixe, value: valeur, maxlength: type === 'email' ? '120' : '60', autocomplete: 'off', 'aria-describedby': texteAide ? 'aide-f-' + suffixe : null });
      return { saisie: saisie, bloc: [el('label', { for: 'f-' + suffixe, texte: libelle }), texteAide ? aide('aide-f-' + suffixe, texteAide) : null, saisie] };
    };
    var nom = champ('nom', 'Nom', 'text', aRemplir ? '' : p.nom);
    var prenom = champ('prenom', 'Prénom', 'text', aRemplir ? '' : p.prenom);
    var mail = champ('mail', 'Adresse de messagerie personnelle', 'email', p.mail, 'C\'est là que partent le lien et tous les messages de l\'outil. Pas d\'adresse France Travail.');
    var depuis = champ('depuis', 'Date du changement', 'date', '', 'Laisse vide pour aujourd\'hui.');
    var statut = function (nature, valeur, libelle) {
      return deuxTemps(libelle, function (b) {
        appel('api_definirStatut', [JETON, p.id, nature, valeur, dateFr(depuis.saisie.value)], suiteGeste('fiche', id, function (r) { return 'C\'est noté, à compter du ' + r.depuis + '.'; }, retour), b);
      });
    };
    var sauver = function (b) {
      appel('api_modifierPersonne', [JETON, p.id, { nom: nom.saisie.value, prenom: prenom.saisie.value, mail: mail.saisie.value }], function (r) {
        if (!r.ok && r.erreur === 'adresse_deja_prise' && r.chez) {
          // L'adresse est sur une autre fiche : on la nomme, et on donne la sortie.
          // Un doublon qui n'a jamais servi se supprime ; un doublon qui a une histoire se désactive.
          var cleDoublon = cleUnique();
          return direAdressePrise(retour, r.chez, !p.secretaire ? null : r.chez.supprimable ? [
            el('p', { texte: 'Si c\'est toi, en double : supprime cette autre fiche. Elle n\'a jamais servi. Son lien s\'éteint et le geste reste au journal.' }),
            bouton('Supprimer le doublon et enregistrer ma fiche', function (b2) {
              appel('api_supprimerPersonne', [JETON, r.chez.id, cleDoublon], function (d) { if (!d.ok) return dire(retour, d); sauver(b2); }, b2);
            })
          ] : [
            el('p', { texte: 'Si c\'est toi, en double : désactive cette autre fiche. Elle reste au journal, rien n\'est effacé, et son lien s\'éteint.' }),
            bouton('Désactiver le doublon et enregistrer ma fiche', function (b2) {
              appel('api_modifierPersonne', [JETON, r.chez.id, { actif: false }], function (d) { if (!d.ok) return dire(retour, d); sauver(b2); }, b2);
            })
          ]);
        }
        if (!r.ok) return dire(retour, r);
        chargerGestion(function () {
          // Le serveur vient de dire où en est la mise en route : on y retourne tant qu'elle n'est pas finie.
          var versRoute = p.secretaire && !routeFinie();
          if (p.secretaire) return aller(versRoute ? 'route' : 'fiche', id, 'Ta fiche est enregistrée.' + (versRoute ? ' Étape suivante : t\'envoyer ton lien.' : ''));
          aller('fiche', id, r.lienCoupe ? { genre: 'afaire', texte: 'Adresse changée. L\'ancien lien est coupé : envoie-lui un nouveau lien.' } : 'Fiche enregistrée.');
        });
      }, b);
    };
    var enregistrer = bouton('Enregistrer la fiche', sauver);
    var blocLien;
    if (p.secretaire) {
      blocLien = [el('p', { texte: 'Ton lien part à l\'adresse ci-dessus. Ton lien actuel cessera de marcher. Tu continueras depuis le nouveau mail.' }),
        aRemplir ? el('p', { classe: 'aide', texte: 'Enregistre d\'abord ta fiche.' }) : deuxTemps('M\'envoyer mon lien à cette adresse', function (b) {
          appel('api_gererLien', [JETON, p.id, 'envoyer'], function (r) { if (r.ok) return vueFinLien(p.mail); dire(retour, r); }, b);
        })];
    } else {
      blocLien = [el('p', { texte: p.lien ? 'Cette personne a reçu son lien.' : 'Pas encore de lien. Tant qu\'elle ne l\'a pas reçu, elle ne peut rien demander.' }),
        el('p', { classe: 'aide', texte: 'Le lien part à l\'adresse de la fiche. S\'il y en avait déjà un, il cesse de marcher.' }),
        bouton(p.lien ? 'Envoyer un nouveau lien' : 'Envoyer son lien', function (b) {
          appel('api_gererLien', [JETON, p.id, 'envoyer'], suiteGeste('fiche', id, 'Lien envoyé à ' + p.mail + '.', retour), b);
        }, p.lien ? 'second' : 'envoi'),
        p.lien ? deuxTemps('Couper son lien', function (b) { appel('api_gererLien', [JETON, p.id, 'revoquer'], suiteGeste('fiche', id, 'Lien coupé.', retour), b); }) : null];
    }
    var versRoute = p.secretaire && !routeFinie();
    // La clé se tire au dessin : deux appuis portent la même, la suppression ne se joue qu'une fois.
    var cleSuppression = cleUnique();
    page(qui, [
      el('p', {}, [bouton(versRoute ? 'Revenir à la mise en route' : 'Revenir à la liste des personnes', function () { aller(versRoute ? 'route' : 'personnes'); }, 'second')]),
      annonce(message), retour,
      p.actif ? null : el('p', { classe: 'encadre info', texte: 'Fiche désactivée : cette personne ne peut plus ouvrir l\'outil.' }),
      el('h2', { texte: '1. Identité et adresse' })
    ].concat(nom.bloc, prenom.bloc, mail.bloc, [enregistrer, el('h2', { texte: '2. Lien personnel' })], blocLien, [
      el('h2', { texte: '3. Mandat et bureau' }),
      el('p', { texte: 'Titulaire d\'un mandat : ' + (p.mandate ? 'oui' : 'non') + '. Membre du bureau : ' + (p.bureau ? 'oui' : 'non') + '.' }),
      el('p', { classe: 'aide', texte: 'Un mandat : CSE, CSEC, CCPLU, CCPN, RP, DS ou RS. Il ouvre les compteurs réservés, le délai de 24 heures et la visite sans accompagnement. Être au bureau n\'est pas un mandat : le bureau ouvre le « Suivi pour le bureau ».' })
    ], depuis.bloc, [
      p.mandate ? statut('mandat', false, 'Mettre fin au mandat') : statut('mandat', true, 'Déclarer titulaire d\'un mandat'),
      p.bureau ? statut('bureau', false, 'Faire sortir du bureau') : statut('bureau', true, 'Faire entrer au bureau'),
      p.secretaire ? null : el('h2', { texte: '4. Désactiver' }),
      p.secretaire ? null : deuxTemps(p.actif ? 'Désactiver la fiche' : 'Réactiver la fiche', function (b) {
        appel('api_modifierPersonne', [JETON, p.id, { actif: !p.actif }], suiteGeste('fiche', id, p.actif ? 'Fiche désactivée, lien coupé.' : 'Fiche réactivée.', retour), b);
      }),
      p.secretaire ? null : el('p', { classe: 'aide', texte: 'Pour une fiche créée par erreur. Possible seulement si la personne n\'a jamais utilisé l\'outil.' }),
      p.secretaire ? null : deuxTemps('Supprimer cette fiche', function (b) {
        appel('api_supprimerPersonne', [JETON, p.id, cleSuppression], suiteGeste('personnes', null, 'Fiche supprimée.', retour), b);
      }, { nom: 'Supprimer la fiche de ' + nomDe(p) })
    ]));
  };

  // --- heures de la section
  ECRANS.heures = function (message) {
    var t = G.tableau;
    var retour = el('div');
    var compteur = el('select', { id: 'h-compteur' }, t.compteurs.map(function (c) { return option(c.code, c.libelle); }));
    var nb = el('input', { type: 'text', id: 'h-heures', inputmode: 'decimal', autocomplete: 'off' });
    var origine = el('input', { type: 'text', id: 'h-origine', maxlength: '80', autocomplete: 'off' });
    // Les premières heures ferment la mise en route : on revient la clore, avec la suite proposée.
    var enRoute = !routeFinie();
    // Clé tirée au dessin de l'écran : deux appuis sur « Ajouter ces heures » n'ajoutent qu'une fois.
    var cle = cleUnique();
    var ajouter = bouton('Ajouter ces heures', function (b) {
      appel('api_doter', [JETON, compteur.value, nb.value, origine.value, cle], function (r) {
        if (!r.ok) return dire(retour, r);
        chargerGestion(function () {
          if (enRoute && routeFinie()) return aller('route', null, 'Heures ajoutées. La mise en route est finie.');
          aller('heures', null, 'Heures ajoutées.');
        });
      }, b);
    });
    // Restitution à la région : les heures rendues sortent du solde. Même garde contre le double appui.
    var retourRendu = el('div');
    var compteurRendu = el('select', { id: 'rg-compteur' }, t.compteurs.map(function (c) { return option(c.code, c.libelle); }));
    var nbRendu = el('input', { type: 'text', id: 'rg-heures', inputmode: 'decimal', autocomplete: 'off' });
    var noteRendu = el('input', { type: 'text', id: 'rg-note', maxlength: '80', autocomplete: 'off' });
    var cleRendu = cleUnique();
    var rendre = bouton('Rendre ces heures à la région', function (b) {
      appel('api_rendreRegion', [JETON, compteurRendu.value, nbRendu.value, noteRendu.value, cleRendu],
        suiteGeste('heures', null, 'Heures rendues à la région. Elles sont sorties du solde.', retourRendu, { solde_insuffisant: 'La section n\'a pas autant d\'heures disponibles sur ce compteur. Regarde la colonne « Solde ».' }), b);
    });
    var rendus = t.rendus || [];
    page('Heures de la section', [
      navigation(true), annonce(message), retour,
      tableau(COLONNES_COMPTEURS, t.compteurs, 'Heures de la section'), el('p', { classe: 'aide', texte: AIDE_COMPTEURS }),
      el('h2', { texte: 'Ajouter des heures reçues' }),
      el('p', { classe: 'aide', texte: 'Une ligne chaque fois que la section reçoit des heures, compteur par compteur. Exemple : 150 heures en janvier sur « Mandats tous ».' }),
      el('label', { for: 'h-compteur', texte: 'Compteur' }), compteur,
      el('label', { for: 'h-heures', texte: 'Nombre d\'heures reçues' }), nb,
      el('label', { for: 'h-origine', texte: 'D\'où viennent ces heures ? (facultatif)' }), origine, ajouter,
      el('h2', { texte: 'Heures déjà ajoutées' }),
      t.dotations.length ? el('div', {}, t.dotations.map(function (d) {
        var c = t.compteurs.filter(function (x) { return x.code === d.compteur; })[0];
        var ligne = (c ? c.libelle : d.compteur) + ', ' + heures(d.heures) + (d.origine ? ', ' + d.origine : '') + (d.date ? ', le ' + dateFr(d.date) : '');
        var cleAnnulation = cleUnique();
        return el('div', { classe: 'ligne rang' }, [
          el('span', { texte: ligne }),
          deuxTemps('Annuler cet ajout', function (b) { appel('api_annulerDotation', [JETON, d.evt_id, cleAnnulation], suiteGeste('heures', null, 'Ajout annulé. L\'annulation est au journal.', retour), b); },
            { nom: 'Annuler cet ajout : ' + ligne })
        ]);
      })) : el('p', { texte: 'Aucune pour l\'instant.' }),
      el('h2', { texte: 'Restitution à la région' }),
      el('p', { classe: 'aide', texte: 'Quand la section rend des heures à la région, note-le ici : elles sortent du solde du compteur. L\'outil ne prévient pas la région, c\'est toi qui le fais.' }),
      retourRendu,
      el('label', { for: 'rg-compteur', texte: 'Compteur des heures rendues' }), compteurRendu,
      el('label', { for: 'rg-heures', texte: 'Nombre d\'heures rendues' }), nbRendu,
      el('label', { for: 'rg-note', texte: 'Précision (facultatif)' }), noteRendu, rendre,
      el('h2', { texte: 'Heures déjà rendues à la région' }),
      rendus.length ? el('div', {}, rendus.map(function (d) {
        var c = t.compteurs.filter(function (x) { return x.code === d.compteur; })[0];
        var ligne = (c ? c.libelle : d.compteur) + ', ' + heures(d.heures) + (d.origine ? ', ' + d.origine : '') + (d.date ? ', le ' + dateFr(d.date) : '');
        var cleAnnulation = cleUnique();
        return el('div', { classe: 'ligne rang' }, [
          el('span', { texte: ligne }),
          deuxTemps('Annuler cette restitution', function (b) { appel('api_annulerDotation', [JETON, d.evt_id, cleAnnulation], suiteGeste('heures', null, 'Restitution annulée. Les heures reviennent dans le solde.', retourRendu), b); },
            { nom: 'Annuler cette restitution : ' + ligne })
        ]);
      })) : el('p', { texte: 'Aucune pour l\'instant.' })
    ]);
  };

  // --- chantiers
  ECRANS.chantiers = function (message) {
    var retour = el('div');
    var textes = { nom: 'Écris le nom du chantier.' };
    var libelle = el('input', { type: 'text', id: 'c-libelle', maxlength: '60', autocomplete: 'off' });
    var ouvrir = bouton('Ouvrir ce chantier', function (b) { appel('api_gererChantier', [JETON, 'ouvrir', libelle.value], suiteGeste('chantiers', null, 'Chantier ouvert.', retour, textes), b); });
    page('Chantiers', [
      navigation(true), annonce(message), retour,
      el('p', { texte: 'Un chantier, c\'est un travail que le bureau a décidé : un texte, un groupe de travail. Ouvert ici, il apparaît dans la liste « Objet » des demandes.' }),
      el('div', {}, G.personnes.chantiers.map(function (c) {
        return el('div', { classe: 'ligne rang' }, [
          el('span', { texte: c.libelle + ', ouvert le ' + dateFr(c.ouvert_le) + (c.clos_le ? ', fermé le ' + dateFr(c.clos_le) : '') }),
          c.clos_le ? null : deuxTemps('Fermer ce chantier', function (b) { appel('api_gererChantier', [JETON, 'clore', c.code], suiteGeste('chantiers', null, 'Chantier fermé.', retour, textes), b); },
            { nom: 'Fermer ce chantier : ' + c.libelle })
        ]);
      })),
      el('h2', { texte: 'Ouvrir un chantier' }),
      el('label', { for: 'c-libelle', texte: 'Nom du chantier décidé par le bureau' }), libelle, ouvrir
    ]);
  };

  // --- réglages
  var REGLAGES = {
    marge_jours_ouvres: { libelle: 'Marge de la section, en jours ouvrés', court: 'Marge de la section, en jours ouvrés', exemple: 'La marge s\'écrit en jours entiers, de 0 à 10. Exemple : 2.' },
    date_effet_regles: { libelle: 'Date d\'effet des règles (jj/mm/aaaa)', court: 'Date d\'effet des règles', exemple: 'La date s\'écrit jj/mm/aaaa. Exemple : 16/02/2027.',
      aide: 'Effet immédiat : à partir de cette date, l\'outil oppose les refus.' },
    seuil_part_sans_mandat: { libelle: 'Repère pour la part cédée sans mandat (0,5 pour 50 %)', court: 'Repère de la part cédée sans mandat', exemple: 'Le repère s\'écrit entre 0 et 1. Exemple : 0,5 pour 50 %.' }
  };
  ECRANS.reglages = function (message) {
    var retour = el('div');
    page('Réglages', [
      navigation(true), annonce(message), retour,
      el('p', { classe: 'encadre', texte: 'Ne change rien ici sans décision du bureau. Un changement prend effet sept jours plus tard, sauf la date d\'effet des règles, et le bureau reçoit un mail.' }),
      el('div', {}, G.tableau.parametres.map(function (p) {
        var r = REGLAGES[p.cle] || { libelle: 'Réglage' };
        var champ = el('input', { type: 'text', id: 'r-' + p.cle, autocomplete: 'off', 'aria-describedby': r.aide ? 'aide-r-' + p.cle : null,
          value: p.cle === 'date_effet_regles' ? dateFr(p.valeur) : String(p.valeur).replace('.', ',') });
        return el('div', { classe: 'carte' }, [el('label', { for: 'r-' + p.cle, texte: r.libelle }), champ,
          r.aide ? aide('aide-r-' + p.cle, r.aide) : null,
          deuxTemps('Modifier', function (b) {
            appel('api_modifierParametre', [JETON, p.cle, champ.value],
              suiteGeste('reglages', null, function (x) { return 'Réglage modifié, effet le ' + x.effet + '. Le bureau reçoit un mail.'; }, retour, r.exemple ? { valeur_hors_liste: r.exemple } : null), b);
          }, { nom: 'Modifier le réglage : ' + r.libelle })]);
      }))
    ]);
  };

  // ------------------------------------------------------------ boîte de test
  function vueBoite() {
    attente('Boîte de test');
    appel('api_boiteTest', [CLE], function (r) {
      if (!r.ok) return lienInvalide();
      var retourTache = el('span');
      var tache = bouton('Jouer la tâche quotidienne', function (b) {
        appel('api_tacheTest', [CLE], function (t) {
          retourTache.textContent = t.ok ? ' Extinctions : ' + t.bilan.expirations + ', liens d\'état : ' + t.bilan.liens + ', relances : ' + t.bilan.relances + ', mains passées : ' + t.bilan.transferts + '. Recharge la page pour voir les messages.' : ' Échec.';
        }, b);
      }, 'second');
      page('Boîte de test', [el('p', { classe: 'encadre test', texte: 'Environnement de TEST : les derniers messages partis, du plus récent au plus ancien. Cette page n\'existe pas en production.' }), el('p', {}, [tache, retourTache])]
        .concat(r.messages.map(function (m) {
          // Le corps du mail est montré tel qu'il part, sans retouche.
          var corps = el('pre');
          m.texte.split(/(https:\/\/\S+)/).forEach(function (bout) {
            var noeud = /^https:\/\//.test(bout) ? el('a', { href: bout }) : null;
            if (noeud) noeud.textContent = bout;
            corps.appendChild(noeud || document.createTextNode(bout));
          });
          return el('div', { classe: 'carte' }, [el('p', { classe: 'num', texte: m.destinataire + ', ' + m.type }), el('p', { texte: m.sujet }), el('p', { classe: 'aide', texte: m.ts }), corps]);
        })));
    });
  }

  // ------------------------------------------- page d'entrée hors Google
  /** Jeton d'un lien collé, de l'ancienne forme (« /exec?j= », « ?a= ») ou de la nouvelle (« #j= », « #a= »). null si rien n'est reconnu. */
  function jetonDuLien(texte) {
    var m = /[?#&]([ja])=([A-Za-z0-9.-]{20,})/.exec(String(texte || ''));
    return m ? { parametre: m[1], valeur: m[2] } : null;
  }
  /** Ouverte sans rien après le « # » : on colle le lien du mail, la page l'ouvre ici. */
  function vueEntree() {
    var champ = el('input', { type: 'text', id: 'lien-colle', autocomplete: 'off', spellcheck: 'false', 'aria-describedby': 'aide-lien-colle' });
    var retour = el('div');
    var ouvrir = function () {
      var lu = jetonDuLien(champ.value);
      if (!lu) {
        vider(retour).appendChild(erreur('Ce lien n\'est pas reconnu. Copie-le en entier depuis le mail.'));
        return;
      }
      // Le jeton passe après le « # » : le changement d'adresse recharge la page sur la bonne vue.
      location.hash = lu.parametre + '=' + lu.valeur;
    };
    champ.addEventListener('keydown', function (ev) { if (ev && ev.key === 'Enter') ouvrir(); });
    page('Ouvre ton espace', [
      el('p', { texte: 'Ton lien est dans le mail « [Heures 77] Ton lien personnel », ou dans un mail de confirmation.' }),
      el('label', { for: 'lien-colle', texte: 'Colle ici le lien reçu par mail' }),
      aide('aide-lien-colle', 'Si Google affiche « Impossible d\'ouvrir le fichier », copie le lien du mail et colle-le ici.'),
      champ, bouton('Ouvrir', function () { ouvrir(); }, 'envoi'), retour
    ], true);
  }

  ({ accueil: vueAccueil, perdu: vuePerdu, action: vueAction, espace: function () { vueEspace(''); }, boite: vueBoite, entree: vueEntree }[VUE] || vueAccueil)();
})();
